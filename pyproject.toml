[project]
name = "demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "classic-criteria>=0.2",
    "classic-db-tools>=3.2",
    "falcon>=4.3",
    "waitress>=3.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
