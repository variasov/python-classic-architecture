[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library"
version = "0.1.0"
description = "Демо-проект «Библиотека» на классической архитектуре"
requires-python = ">=3.10"
dependencies = [
    "falcon",
    "waitress",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "classic-db-tools",
    "classic-migrations",
    "classic-criteria",
    "classic-signals",
    "classic-scheduler",
    "urllib3",
    "tenacity",
    "orjson>=3.13.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-httpserver",
    "hypothesis",
    "freezegun",
    "python-dotenv",
    "mutmut",
    "pyright[nodejs]~=1.1.411",
    "ruff~=0.16.4",
    "vulture~=2.16",
    "import-linter>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    ".venv",
]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
extraPaths = [".", "src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # keeps D211: no blank line before class docstring
    "D213",     # keeps D212: multi-line summary on first line
    "EM",       # error-message style is overly prescriptive
    "TRY003",   # long exception messages are an API concern
    "ANN401",   # DB driver objects are dynamically typed
    "N802",     # Settings properties mirror environment variable names
    "N818",     # exception names are part of the public API
    "INP001",   # namespace packages without __init__.py by design
    "D1",       # docstrings only where they explain a contract, not everywhere
    "CPY001",   # no copyright headers
    "A002",     # `id` argument in repositories and DTO is part of the API
    "TC",       # dataclasses and TypeAdapter need annotation types at runtime
    "RUF001",   # Cyrillic in strings is intended
    "RUF002",   # Cyrillic in docstrings is intended
    "RUF003",   # Cyrillic in comments is intended
    "COM812",   # conflicts with the formatter, ruff's own recommendation
    "DTZ011",   # spec: usecases take `date.today()` as the operation date
    "S101",     # `assert x.id is not None` narrows Optional ids after save
    "ARG002",   # falcon resource/middleware signatures require resp even when unused
    "PLR2004",  # 13 (ISBN) and HTTP codes are domain constants inline
    "PLR0913",  # create_app takes one resource per route by design
    "PLR0917",  # same: explicit resources beat a magic dict
    "PERF203",  # retry loop is small and must catch per attempt
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "SLF001",
    "S101",     # `assert` is idiomatic in pytest
    "D",        # tests do not need docstrings
    "ANN",      # test annotations are optional
    "FBT",      # boolean positional args in test helpers
    "PLR2004",  # magic values are acceptable in assertions
    "PLR0913",  # many-argument test helpers
    "PT011",    # broad pytest.raises is acceptable in tests
    "PT012",    # pytest.raises blocks may legitimately hold several statements
    "ARG",      # unused fixture/helper args
    "CPY001",   # tests do not carry copyright headers
    "S608",     # SQL strings in tests are not injection vectors
    "PLR0917",  # parametrized fixtures legitimately take many repo arguments
    "PLC0415",  # composite imports must be deferred behind test fixtures/env
    "B017",     # invalid-aggregate tests assert any failure on save
]
"src/library/composites/interfaces/web_api/wsgi.py" = [
    "PLC0414",  # side-effect import registers the domain reaction per spec
]
"vulture_whitelist.py" = [
    "B018",     # bare names ARE the vulture whitelist
    "F821",     # whitelist entries reference names defined elsewhere
    "E501",
]

[tool.vulture]
paths = ["src", "tests", "vulture_whitelist.py"]
min_confidence = 80

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]

[tool.importlinter]
root_packages = ["library", "classic"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: composites -> adapters -> app"
type = "layers"
layers = [
    "library.composites",
    "library.interfaces | library.infra | library.integrations",
    "library.app",
]

[[tool.importlinter.contracts]]
name = "Domain imports only stdlib minimum and allowed classic packages"
type = "forbidden"
source_modules = ["library.app.commands.domain"]
forbidden_modules = ["*", "library.app.*", "library.app.commands.*"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "library.app.commands.domain.** -> abc",
    "library.app.commands.domain.** -> collections",
    "library.app.commands.domain.** -> dataclasses",
    "library.app.commands.domain.** -> datetime",
    "library.app.commands.domain.** -> enum",
    "library.app.commands.domain.** -> typing",
    "library.app.commands.domain.** -> classic.criteria",
    "library.app.commands.domain.** -> classic.criteria.**",
    "library.app.commands.domain.** -> classic.signals",
    "library.app.commands.domain.** -> classic.signals.**",
]

[[tool.importlinter.contracts]]
name = "Queries do not import commands"
type = "forbidden"
source_modules = ["library.app.queries"]
forbidden_modules = ["library.app.commands"]

[[tool.importlinter.contracts]]
name = "App imports only allowed libraries"
type = "forbidden"
source_modules = ["library.app"]
forbidden_modules = ["*"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "library.app.** -> abc",
    "library.app.** -> collections",
    "library.app.** -> dataclasses",
    "library.app.** -> datetime",
    "library.app.** -> enum",
    "library.app.** -> logging",
    "library.app.** -> typing",
    "library.app.** -> classic.criteria",
    "library.app.** -> classic.criteria.**",
    "library.app.** -> classic.signals",
    "library.app.** -> classic.signals.**",
]
