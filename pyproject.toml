[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library"
version = "0.1.0"
description = "Демо-проект «Библиотека» в классической архитектуре"
requires-python = ">=3.10"
dependencies = [
    "falcon",
    "waitress",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "classic-db-tools",
    "classic-migrations",
    "classic-criteria",
    "classic-signals",
    "classic-error-handling",
    "classic-scheduler",
    "urllib3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.setuptools.packages.find]
where = ["sources"]
namespaces = true

[tool.setuptools.package-data]
"*" = ['*.sql', '*.sql.tmpl']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sources"]
