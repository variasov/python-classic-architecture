[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library"
version = "0.1.0"
description = "Demo library application in classic architecture"
requires-python = ">=3.10"
dependencies = [
    "falcon",
    "waitress",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "classic-db-tools",
    "classic-migrations",
    "classic-criteria",
    "classic-signals",
    "classic-error-handling",
    "classic-scheduler",
    "urllib3",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-httpserver",
    "pyright[nodejs]~=1.1.411",
    "ruff~=0.16.4",
    "vulture~=2.16",
    "mutmut",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    ".venv",
]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
# pytest injects fixtures dynamically, so their types are unknown to pyright.
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
extraPaths = [".", "src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "EM",
    "TRY003",
    "ANN401",
    "N802",
    "N818",
    "INP001",
    "D1",
    "CPY001",
    "A002",
    "TC",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = [
    "B018",  # whitelist entries are intentional bare name references
    "F821",  # names live in the source tree, not in the whitelist file
]
"tests/**" = [
    "SLF001",
    "S101",
    "D",
    "ANN",
    "FBT",
    "PLR2004",
    "PLR0913",
    "PLR0917",  # pytest fixtures are injected as positional parameters
    "PT011",
    "PT012",
    "ARG",
    "CPY001",
    "S608",
]

[tool.vulture]
paths = ["src", "tests", "vulture_whitelist.py"]
min_confidence = 80

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/library/app/*"]
pytest_add_cli_args = ["tests/unit", "-q", "-p", "no:cacheprovider"]
use_git_change_detection = false
type_check_command = ["../.venv-wsl/bin/pyright", "--outputjson", "--pythonpath", "../.venv-wsl/bin/python", "-p", "../.pyright-mutmut.toml"]
